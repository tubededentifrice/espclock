<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ESPClock ESP32-C3 Super Mini travel-build wiring</title>
  <desc id="desc">Component-side wiring guide showing an ESP32-C3 Super Mini connected at 3.3 volts to a TM1637 clock display, BH1750 light sensor, DS3231 real-time clock, and decoupling capacitors, with an inset showing the supported SSD1306 128 by 64 and 128 by 32 OLED display alternatives.</desc>
  <defs>
    <style>
      .title{font-family:Arial,sans-serif;font-size:27px;font-weight:700;fill:#12212b}
      .subtitle{font-family:Arial,sans-serif;font-size:14px;fill:#415563}
      .heading{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#12212b}
      .label{font-family:Arial,sans-serif;font-size:13px;font-weight:600;fill:#13212b}
      .small{font-family:Arial,sans-serif;font-size:12px;fill:#334a58}
      .silk{font-family:Menlo,monospace;font-size:9px;fill:#f4f7f8}
      .note{font-family:Arial,sans-serif;font-size:12px;fill:#6b2323}
      .module{stroke:#263a46;stroke-width:2}
      .pin{stroke:#13212b;stroke-width:1.5}
      .unused{fill:#d4dce0}
      .selected{fill:#fff;stroke-width:2.5}
      .junction{stroke:#fff;stroke-width:1.5}
      .callout{fill:#fff8dc;stroke:#b27b00;stroke-width:1.5}
      .danger{fill:#fff1ef;stroke:#bd3434;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f7f9fa"/>
  <text x="45" y="45" class="title">ESPClock travel-build wiring — component side</text>
  <text x="45" y="70" class="subtitle">Fit one display profile: TM1637 travel display shown wired; SSD1306 OLED alternatives are inset below. Confirm every module silkscreen before soldering.</text>

  <!-- Perfboard field -->
  <rect x="575" y="105" width="780" height="630" rx="12" fill="#e6d6a8" stroke="#735d2a" stroke-width="3"/>
  <text x="595" y="132" class="small">5 × 7 cm perfboard area — trim only after bench testing</text>

  <!-- TM1637 module, intentionally off-board -->
  <g>
    <rect x="45" y="155" width="485" height="255" rx="12" fill="#8e1d24" class="module"/>
    <circle cx="67" cy="177" r="7" fill="#f7f9fa" stroke="#5d1015" stroke-width="3"/>
    <circle cx="508" cy="177" r="7" fill="#f7f9fa" stroke="#5d1015" stroke-width="3"/>
    <circle cx="67" cy="388" r="7" fill="#f7f9fa" stroke="#5d1015" stroke-width="3"/>
    <circle cx="508" cy="388" r="7" fill="#f7f9fa" stroke="#5d1015" stroke-width="3"/>
    <text x="64" y="190" class="silk">TM1637 1.2-inch red clock module</text>
    <rect x="82" y="210" width="365" height="130" rx="7" fill="#21080a" stroke="#520d12" stroke-width="4"/>
    <text x="113" y="300" style="font-family:Menlo,monospace;font-size:84px;font-weight:700;fill:#ef2e39;letter-spacing:3px">12:34</text>
    <rect x="457" y="225" width="52" height="112" rx="5" fill="#65131a" stroke="#d38a8e"/>
    <text x="483" y="244" text-anchor="middle" class="silk">GND</text>
    <text x="483" y="273" text-anchor="middle" class="silk">VCC</text>
    <text x="483" y="302" text-anchor="middle" class="silk">CLK</text>
    <text x="483" y="331" text-anchor="middle" class="silk">DIO</text>
    <circle cx="530" cy="240" r="6" fill="#273036" class="pin"/>
    <circle cx="530" cy="269" r="6" fill="#dc3346" class="pin"/>
    <circle cx="530" cy="298" r="6" fill="#ee9800" class="pin"/>
    <circle cx="530" cy="327" r="6" fill="#7850d8" class="pin"/>
  </g>
  <text x="46" y="435" class="small">Front-panel module • four-wire harness with strain relief</text>

  <!-- Supported OLED alternatives: use instead of the TM1637 -->
  <g>
    <rect x="45" y="462" width="485" height="190" rx="10" fill="#eef4f7" stroke="#44616f" stroke-width="2"/>
    <text x="65" y="487" class="heading">Supported OLED alternative — fit instead of TM1637</text>
    <rect x="65" y="505" width="235" height="123" rx="8" fill="#155a87" class="module"/>
    <circle cx="80" cy="520" r="5" fill="#eef4f7" stroke="#0e3f5f" stroke-width="2"/>
    <circle cx="285" cy="520" r="5" fill="#eef4f7" stroke="#0e3f5f" stroke-width="2"/>
    <rect x="82" y="522" width="201" height="72" rx="4" fill="#07131b" stroke="#8aa6b4" stroke-width="2"/>
    <text x="182.5" y="568" text-anchor="middle" style="font-family:Menlo,monospace;font-size:34px;font-weight:700;fill:#d8f4ff">12:34</text>
    <circle cx="94" cy="628" r="6" fill="#dc3346" class="pin"/>
    <circle cx="140" cy="628" r="6" fill="#273036" class="pin"/>
    <circle cx="186" cy="628" r="6" fill="#1687a8" class="pin"/>
    <circle cx="232" cy="628" r="6" fill="#18844f" class="pin"/>
    <text x="94" y="617" text-anchor="middle" class="silk">VCC</text>
    <text x="140" y="617" text-anchor="middle" class="silk">GND</text>
    <text x="186" y="617" text-anchor="middle" class="silk">SCL</text>
    <text x="232" y="617" text-anchor="middle" class="silk">SDA</text>

    <rect x="318" y="507" width="192" height="27" rx="13" fill="#d8ecf6" stroke="#4e7588"/>
    <text x="414" y="525" text-anchor="middle" class="label">128×64 • profile selected</text>
    <rect x="318" y="542" width="192" height="27" rx="13" fill="#f6f7f8" stroke="#71828c"/>
    <text x="414" y="560" text-anchor="middle" class="label">128×32 • same four wires</text>
    <text x="318" y="589" class="small">OLED VCC → 3V3</text>
    <text x="318" y="607" class="small">OLED GND → GND</text>
    <text x="318" y="625" class="small">OLED SDA/SCL → GPIO6/GPIO7 I2C bus</text>
    <text x="318" y="643" class="small">Fit one display type for the selected profile.</text>
  </g>

  <!-- ESP32-C3 Super Mini -->
  <g>
    <rect x="625" y="178" width="205" height="315" rx="10" fill="#202a2f" class="module"/>
    <text x="727.5" y="205" text-anchor="middle" class="silk" style="font-weight:700">ESP32-C3 SUPER MINI</text>

    <!-- Ceramic antenna and keep-out -->
    <rect x="687" y="214" width="81" height="34" rx="4" fill="#d6d9ce" stroke="#6c726d" stroke-width="2"/>
    <path d="M697 238h12v-16h12v16h12v-16h12v16h13" fill="none" stroke="#8e918b" stroke-width="3"/>
    <rect x="666" y="154" width="123" height="105" rx="8" fill="none" stroke="#c53b3b" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="727.5" y="169" text-anchor="middle" class="note">ANTENNA KEEP-OUT</text>

    <!-- Main package, buttons, LEDs and regulator -->
    <rect x="682" y="278" width="91" height="91" rx="5" fill="#11181c" stroke="#71808a" stroke-width="2"/>
    <text x="727.5" y="316" text-anchor="middle" class="silk">ESP32-C3</text>
    <text x="727.5" y="334" text-anchor="middle" class="silk">4 MB</text>
    <rect x="657" y="390" width="34" height="24" rx="4" fill="#c9cdd0" stroke="#6b747a"/>
    <rect x="764" y="390" width="34" height="24" rx="4" fill="#c9cdd0" stroke="#6b747a"/>
    <text x="674" y="428" text-anchor="middle" class="silk">RST</text>
    <text x="781" y="428" text-anchor="middle" class="silk">BOOT</text>
    <circle cx="705" cy="397" r="5" fill="#34b96f"/>
    <circle cx="750" cy="397" r="5" fill="#e7d52f"/>
    <rect x="704" y="438" width="47" height="23" rx="3" fill="#20262a" stroke="#9ba5aa"/>

    <!-- USB-C protrudes beyond the board body -->
    <rect x="681" y="474" width="93" height="38" rx="8" fill="#c7d0d5" stroke="#4d5a62" stroke-width="2"/>
    <rect x="700" y="486" width="55" height="12" rx="6" fill="#303b41"/>
    <text x="727.5" y="530" text-anchor="middle" class="small">USB-C / 5 V input</text>

    <!-- Left 8-pin header: common Super Mini top-view order -->
    <g>
      <circle cx="625" cy="228" r="7" class="pin unused"/><text x="642" y="232" class="silk">5V</text>
      <circle cx="625" cy="258" r="7" class="pin selected" stroke="#273036"/><text x="642" y="262" class="silk">GND</text>
      <circle cx="625" cy="288" r="7" class="pin selected" stroke="#dc3346"/><text x="642" y="292" class="silk">3V3</text>
      <circle cx="625" cy="318" r="7" class="pin selected" stroke="#ee9800"/><text x="642" y="322" class="silk">GPIO4</text>
      <circle cx="625" cy="348" r="7" class="pin selected" stroke="#7850d8"/><text x="642" y="352" class="silk">GPIO3</text>
      <circle cx="625" cy="378" r="7" class="pin unused"/><text x="642" y="382" class="silk">GPIO2</text>
      <circle cx="625" cy="408" r="7" class="pin unused"/><text x="642" y="412" class="silk">GPIO1</text>
      <circle cx="625" cy="438" r="7" class="pin unused"/><text x="642" y="442" class="silk">GPIO0</text>
    </g>

    <!-- Right 8-pin header -->
    <g>
      <circle cx="830" cy="228" r="7" class="pin unused"/><text x="813" y="232" text-anchor="end" class="silk">GPIO5</text>
      <circle cx="830" cy="258" r="7" class="pin selected" stroke="#18844f"/><text x="813" y="262" text-anchor="end" class="silk">GPIO6</text>
      <circle cx="830" cy="288" r="7" class="pin selected" stroke="#1687a8"/><text x="813" y="292" text-anchor="end" class="silk">GPIO7</text>
      <circle cx="830" cy="318" r="7" class="pin unused"/><text x="813" y="322" text-anchor="end" class="silk">GPIO8</text>
      <circle cx="830" cy="348" r="7" class="pin unused"/><text x="813" y="352" text-anchor="end" class="silk">GPIO9</text>
      <circle cx="830" cy="378" r="7" class="pin unused"/><text x="813" y="382" text-anchor="end" class="silk">GPIO10</text>
      <circle cx="830" cy="408" r="7" class="pin unused"/><text x="813" y="412" text-anchor="end" class="silk">GPIO20</text>
      <circle cx="830" cy="438" r="7" class="pin unused"/><text x="813" y="442" text-anchor="end" class="silk">GPIO21</text>
    </g>
  </g>
  <text x="727.5" y="555" text-anchor="middle" class="small">Approx. 22 × 18 mm body • socket both 8-pin rows</text>

  <!-- Direct TM1637 harness -->
  <polyline points="530,240 565,240 565,258 625,258" fill="none" stroke="#273036" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="530,269 575,269 575,288 625,288" fill="none" stroke="#dc3346" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="530,298 585,298 585,318 625,318" fill="none" stroke="#ee9800" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="530,327 595,327 595,348 625,348" fill="none" stroke="#7850d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- BH1750 / GY-302 board -->
  <g>
    <rect x="1015" y="155" width="285" height="185" rx="10" fill="#1678a3" class="module"/>
    <circle cx="1040" cy="180" r="6" fill="#f7f9fa" stroke="#0c4d6c" stroke-width="3"/>
    <circle cx="1275" cy="180" r="6" fill="#f7f9fa" stroke="#0c4d6c" stroke-width="3"/>
    <text x="1157" y="184" text-anchor="middle" class="silk" style="font-size:13px;font-weight:700">GY-302 • BH1750</text>
    <rect x="1121" y="212" width="72" height="72" rx="4" fill="#e7ebea" stroke="#293a43" stroke-width="2"/>
    <circle cx="1157" cy="248" r="12" fill="#d4d9d8" stroke="#6b7477"/>
    <rect x="1045" y="223" width="38" height="18" rx="2" fill="#1c2930" stroke="#84929a"/>
    <rect x="1230" y="218" width="31" height="22" rx="2" fill="#d1a45a" stroke="#6b5329"/>
    <text x="1157" y="307" text-anchor="middle" class="silk">Face sensor toward a shaded aperture</text>
    <circle cx="1045" cy="340" r="6" fill="#dc3346" class="pin"/>
    <circle cx="1100" cy="340" r="6" fill="#273036" class="pin"/>
    <circle cx="1155" cy="340" r="6" fill="#1687a8" class="pin"/>
    <circle cx="1210" cy="340" r="6" fill="#18844f" class="pin"/>
    <circle cx="1265" cy="340" r="6" fill="#d4dce0" class="pin"/>
    <text x="1045" y="329" text-anchor="middle" class="silk">VCC</text>
    <text x="1100" y="329" text-anchor="middle" class="silk">GND</text>
    <text x="1155" y="329" text-anchor="middle" class="silk">SCL</text>
    <text x="1210" y="329" text-anchor="middle" class="silk">SDA</text>
    <text x="1265" y="329" text-anchor="middle" class="silk">ADDR</text>
  </g>
  <text x="1265" y="360" text-anchor="middle" class="small">leave low/default</text>

  <!-- DS3231 module -->
  <g>
    <rect x="950" y="430" width="380" height="240" rx="10" fill="#176caa" class="module"/>
    <circle cx="975" cy="455" r="6" fill="#f7f9fa" stroke="#0d456d" stroke-width="3"/>
    <circle cx="1305" cy="455" r="6" fill="#f7f9fa" stroke="#0d456d" stroke-width="3"/>
    <text x="1140" y="460" text-anchor="middle" class="silk" style="font-size:13px;font-weight:700">ZS-042 / HW-111 style DS3231 RTC</text>
    <rect x="985" y="485" width="76" height="48" rx="4" fill="#171f24" stroke="#9ba6ac" stroke-width="2"/>
    <text x="1023" y="513" text-anchor="middle" class="silk">DS3231</text>
    <circle cx="1198" cy="548" r="78" fill="#cbd0d2" stroke="#4f5b61" stroke-width="4"/>
    <circle cx="1198" cy="548" r="64" fill="#e5e8e9" stroke="#8b969b" stroke-width="2"/>
    <text x="1198" y="543" text-anchor="middle" class="label" style="fill:#445058">CR2032</text>
    <text x="1198" y="562" text-anchor="middle" class="small">3 V primary cell</text>
    <rect x="980" y="554" width="122" height="54" rx="6" class="danger"/>
    <text x="1041" y="575" text-anchor="middle" class="note">REMOVE / VERIFY</text>
    <text x="1041" y="592" text-anchor="middle" class="note">charge path first</text>
    <circle cx="950" cy="500" r="6" fill="#dc3346" class="pin"/>
    <circle cx="950" cy="530" r="6" fill="#273036" class="pin"/>
    <circle cx="950" cy="560" r="6" fill="#18844f" class="pin"/>
    <circle cx="950" cy="590" r="6" fill="#1687a8" class="pin"/>
    <circle cx="950" cy="620" r="6" fill="#d4dce0" class="pin"/>
    <circle cx="950" cy="650" r="6" fill="#d4dce0" class="pin"/>
    <text x="968" y="504" class="silk">VCC</text>
    <text x="968" y="534" class="silk">GND</text>
    <text x="968" y="564" class="silk">SDA</text>
    <text x="968" y="594" class="silk">SCL</text>
    <text x="968" y="624" class="silk">SQW</text>
    <text x="968" y="654" class="silk">32K</text>
  </g>

  <!-- I2C buses -->
  <polyline points="830,258 875,258 875,380 1210,380 1210,340" fill="none" stroke="#18844f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="875,380 875,560 950,560" fill="none" stroke="#18844f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="875" cy="380" r="6" fill="#18844f" class="junction"/>
  <polyline points="830,288 905,288 905,400 1155,400 1155,340" fill="none" stroke="#1687a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="905,400 905,590 950,590" fill="none" stroke="#1687a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="905" cy="400" r="6" fill="#1687a8" class="junction"/>

  <!-- Power and ground rails -->
  <polyline points="625,288 610,288 610,760 1340,760" fill="none" stroke="#dc3346" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="1045,340 1045,365 1335,365 1335,760" fill="none" stroke="#dc3346" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="950,500 925,500 925,760" fill="none" stroke="#dc3346" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="925" cy="760" r="6" fill="#dc3346" class="junction"/>
  <circle cx="1045" cy="760" r="6" fill="#dc3346" class="junction"/>

  <polyline points="625,258 590,258 590,800 1345,800" fill="none" stroke="#273036" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="1100,340 1100,385 1345,385 1345,800" fill="none" stroke="#273036" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="950,530 940,530 940,800" fill="none" stroke="#273036" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="940" cy="800" r="6" fill="#273036" class="junction"/>
  <circle cx="1100" cy="800" r="6" fill="#273036" class="junction"/>

  <!-- Decoupling capacitors -->
  <g>
    <text x="710" y="600" text-anchor="middle" class="heading">Display bulk capacitor</text>
    <ellipse cx="710" cy="665" rx="33" ry="14" fill="#17252d" stroke="#071015" stroke-width="2"/>
    <rect x="677" y="628" width="66" height="38" fill="#223743" stroke="#071015" stroke-width="2"/>
    <ellipse cx="710" cy="628" rx="33" ry="14" fill="#324a57" stroke="#071015" stroke-width="2"/>
    <rect x="733" y="633" width="7" height="29" fill="#d7dce0"/>
    <text x="710" y="650" text-anchor="middle" class="silk">100 µF</text>
    <line x1="695" y1="679" x2="695" y2="760" stroke="#dc3346" stroke-width="5" stroke-linecap="round"/>
    <line x1="725" y1="679" x2="725" y2="800" stroke="#273036" stroke-width="5" stroke-linecap="round"/>
    <text x="688" y="700" class="small">+</text>
    <text x="727" y="700" class="small">− stripe</text>
  </g>

  <g>
    <text x="1225" y="713" text-anchor="middle" class="small">100 nF ceramic near I2C modules</text>
    <rect x="1206" y="726" width="38" height="24" rx="4" fill="#d49b32" stroke="#694915" stroke-width="2"/>
    <line x1="1214" y1="750" x2="1214" y2="760" stroke="#dc3346" stroke-width="5" stroke-linecap="round"/>
    <line x1="1236" y1="750" x2="1236" y2="800" stroke="#273036" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Rail labels and safety callouts -->
  <rect x="45" y="680" width="470" height="82" rx="8" class="callout"/>
  <text x="65" y="708" class="label">Before power</text>
  <text x="65" y="730" class="small">All modules use 3.3 V • common ground • verify capacitor polarity</text>
  <text x="65" y="750" class="small">Never attach modules to GPIO2/8/9 or native-USB GPIO18/19</text>

  <rect x="45" y="775" width="470" height="70" rx="8" class="danger"/>
  <text x="65" y="802" class="label" style="fill:#8f2020">CR2032 safety</text>
  <text x="65" y="824" class="small">Do not install a primary CR2032 until the RTC charging path is removed</text>
  <text x="65" y="841" class="small">or proven absent. Enclose the cell behind screws before child use.</text>

  <text x="625" y="754" class="label" style="fill:#c82b3f">+3V3 rail</text>
  <text x="625" y="794" class="label">GND rail</text>

  <!-- Legend -->
  <g transform="translate(575 844)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#dc3346" stroke-width="5" stroke-linecap="round"/><text x="48" y="5" class="small">3.3 V</text>
    <line x1="125" y1="0" x2="163" y2="0" stroke="#273036" stroke-width="5" stroke-linecap="round"/><text x="173" y="5" class="small">GND</text>
    <line x1="240" y1="0" x2="278" y2="0" stroke="#ee9800" stroke-width="4" stroke-linecap="round"/><text x="288" y="5" class="small">GPIO4 / CLK</text>
    <line x1="0" y1="28" x2="38" y2="28" stroke="#7850d8" stroke-width="4" stroke-linecap="round"/><text x="48" y="33" class="small">GPIO3 / DIO</text>
    <line x1="170" y1="28" x2="208" y2="28" stroke="#18844f" stroke-width="4" stroke-linecap="round"/><text x="218" y="33" class="small">GPIO6 / SDA</text>
    <line x1="340" y1="28" x2="378" y2="28" stroke="#1687a8" stroke-width="4" stroke-linecap="round"/><text x="388" y="33" class="small">GPIO7 / SCL</text>
  </g>
</svg>
