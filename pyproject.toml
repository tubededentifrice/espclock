[project]
name = "espclock-tools"
version = "0.1.0"
description = "Pinned host-side development tools for the ESPClock firmware"
requires-python = ">=3.13,<3.14"
dependencies = [
    # PlatformIO's exact upstream Starlette 1.x compatibility commit.
    "platformio==6.1.20b1",
    "pyserial==3.5",
    # Direct pin clears the Starlette advisories while PlatformIO remains prerelease.
    "starlette==1.3.1",
]

[tool.uv.sources]
platformio = { git = "https://github.com/platformio/platformio-core.git", rev = "6bf706c9b09ba41beb245b608e63e52578f83c06" }

[tool.uv]
package = false
exclude-newer = "2 weeks"
required-version = ">=0.12.0"
