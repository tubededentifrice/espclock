[platformio]
default_envs = esp32-devkit-oled-128x64
lib_dir = shared
core_dir = .platformio

[env]
platform = platformio/espressif32@6.10.0
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = default.csv
platform_packages =
    ${pinned_common_packages.platform_packages}
build_src_filter =
    +<*>
    -<RadioDiagnostic.cpp>
lib_deps =
    adafruit/RTClib@2.1.4
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    https://github.com/avishorp/TM1637.git#82214be06742bf187fab4f29aaabb64c289eaae0
    claws/BH1750@1.3.0
    h2zero/NimBLE-Arduino@1.4.3

[common]
radio_flags =
    -D CONFIG_BT_NIMBLE_MAX_BONDS=16
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=16
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CLOCK_ENABLE_OPEN_WIFI_FALLBACK=1
    -D CLOCK_ENABLE_CAPTIVE_PORTAL_AUTOFILL=1

[classic_esp32]
board = esp32dev
platform_packages =
    ${env.platform_packages}
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
board_flags =
    ${common.radio_flags}
    -D CLOCK_I2C_SDA_PIN=21
    -D CLOCK_I2C_SCL_PIN=22
    -D CLOCK_RECOVERY_BUTTON_PIN=0
    -D CLOCK_TM1637_CLK_PIN=25
    -D CLOCK_TM1637_DIO_PIN=26

[c3]
board = esp32-c3-devkitm-1
platform_packages =
    ${env.platform_packages}
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board_flags =
    ${common.radio_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CLOCK_TM1637_CLK_PIN=4
    -D CLOCK_TM1637_DIO_PIN=3
    -D CLOCK_I2C_SDA_PIN=6
    -D CLOCK_I2C_SCL_PIN=7
    -D CLOCK_RECOVERY_BUTTON_PIN=9

[c3_app]
framework = arduino, espidf
platform_packages =
    ${c3.platform_packages}
    platformio/framework-espidf@3.40407.240606
    platformio/tool-cmake@3.16.4
    platformio/tool-ninja@1.13.2
partitions = partitions-espclock.csv
cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.c3.defaults"

[env:esp32-devkit-oled-128x64]
board = ${classic_esp32.board}
platform_packages = ${classic_esp32.platform_packages}
build_flags =
    ${classic_esp32.board_flags}
    -D CLOCK_DISPLAY_DRIVER=CLOCK_DISPLAY_SSD1306
    -D CLOCK_OLED_WIDTH=128
    -D CLOCK_OLED_HEIGHT=64

[env:esp32-devkit-oled-128x32]
board = ${classic_esp32.board}
platform_packages = ${classic_esp32.platform_packages}
build_flags =
    ${classic_esp32.board_flags}
    -D CLOCK_DISPLAY_DRIVER=CLOCK_DISPLAY_SSD1306
    -D CLOCK_OLED_WIDTH=128
    -D CLOCK_OLED_HEIGHT=32

[env:esp32-devkit-tm1637]
board = ${classic_esp32.board}
platform_packages = ${classic_esp32.platform_packages}
build_flags =
    ${classic_esp32.board_flags}
    -D CLOCK_DISPLAY_DRIVER=CLOCK_DISPLAY_TM1637

[env:esp32-c3-super-mini]
board = ${c3.board}
framework = ${c3_app.framework}
platform_packages = ${c3_app.platform_packages}
board_build.partitions = ${c3_app.partitions}
board_build.cmake_extra_args = ${c3_app.cmake_extra_args}
build_src_filter =
build_flags =
    ${c3.board_flags}
    -D CLOCK_DISPLAY_DRIVER=CLOCK_DISPLAY_TM1637

[env:esp32-c3-oled-128x64]
board = ${c3.board}
framework = ${c3_app.framework}
platform_packages = ${c3_app.platform_packages}
board_build.partitions = ${c3_app.partitions}
board_build.cmake_extra_args = ${c3_app.cmake_extra_args}
build_src_filter =
build_flags =
    ${c3.board_flags}
    -D CLOCK_DISPLAY_DRIVER=CLOCK_DISPLAY_SSD1306
    -D CLOCK_OLED_WIDTH=128
    -D CLOCK_OLED_HEIGHT=64

[env:esp32-c3-oled-128x32]
board = ${c3.board}
framework = ${c3_app.framework}
platform_packages = ${c3_app.platform_packages}
board_build.partitions = ${c3_app.partitions}
board_build.cmake_extra_args = ${c3_app.cmake_extra_args}
build_src_filter =
build_flags =
    ${c3.board_flags}
    -D CLOCK_DISPLAY_DRIVER=CLOCK_DISPLAY_SSD1306
    -D CLOCK_OLED_WIDTH=128
    -D CLOCK_OLED_HEIGHT=32

[env:esp32-devkit-radio-diagnostic]
board = ${classic_esp32.board}
platform_packages = ${classic_esp32.platform_packages}
build_flags =
    ${classic_esp32.board_flags}
build_src_filter =
    +<ClockCore.cpp>
    +<RadioDiagnostic.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

[env:esp32-c3-radio-diagnostic]
board = ${c3.board}
platform_packages = ${c3.platform_packages}
build_flags =
    ${c3.board_flags}
build_src_filter =
    +<ClockCore.cpp>
    +<RadioDiagnostic.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

[env:native]
platform = platformio/native@1.2.1
framework =
platform_packages =
    platformio/tool-scons@4.40801.0
lib_deps =
test_framework = unity
test_build_src = true
build_src_filter =
    +<ClockCore.cpp>
    +<CaptivePortalAutofillCore.cpp>
    -<main.cpp>
    -<BleTimeService.cpp>
    -<DisplayController.cpp>
    -<DisplayBackendFactory.cpp>
    -<Tm1637DisplayBackend.cpp>
    -<Ssd1306DisplayBackend.cpp>
    -<NetworkTimeService.cpp>
    -<TimeKeeper.cpp>

[pinned_common_packages]
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-mkfatfs@2.0.1
    platformio/tool-mklittlefs@1.203.210628
    platformio/tool-mkspiffs@2.230.0
    platformio/tool-openocd-esp32@2.1100.20220706
    platformio/tool-scons@4.40801.0
    platformio/toolchain-esp32ulp@1.23800.240113
